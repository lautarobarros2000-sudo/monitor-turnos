name: Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 min (GitHub puede demorarlo algunos minutos)
  workflow_dispatch: {}      # permite correrlo a mano desde la pestana Actions

permissions:
  contents: write            # para guardar estado.json entre corridas

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Consultar disponibilidad
        shell: pwsh
        env:
          CLUB_ID: ${{ secrets.CLUB_ID }}
          SPORT_ID: ${{ secrets.SPORT_ID }}
          DIAS: ${{ secrets.DIAS }}
          HORA_DESDE: ${{ secrets.HORA_DESDE }}
          HORA_HASTA: ${{ secrets.HORA_HASTA }}
          DURACION_MIN: ${{ secrets.DURACION_MIN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ./monitor-canchas.ps1
          Get-Content ./monitor.log -ErrorAction SilentlyContinue

      - name: Guardar estado si cambio
        run: |
          if ! git diff --quiet -- estado.json || [ -n "$(git ls-files --others -- estado.json)" ]; then
            git config user.name "monitor-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "estado: actualizar"
            git push
          fi
